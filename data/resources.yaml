# Curated resources shown on opensourcedesign.net/resources/
#
# THIS IS THE FILE TO EDIT to add, change, or remove a resource - no HTML or
# template knowledge needed. The page is rendered by the `resources` shortcode
# (layouts/shortcodes/resources.html), placed in content/resources/_index.md.
#
# Structure:
#   - id:    stable slug for the category (used for #anchors and ?cat= filters)
#     title: category heading shown on the page (also the filter chip label)
#     note:  optional intro text under the heading (markdown supported)
#     items:
#       - name:        display name of the resource (required)
#         url:         where the name links to (required)
#         description: short plain-text blurb shown after the name (optional)
#         links:       optional extra links shown after the description
#           - text: link label
#             url:  link target
#
# The Reading & Research bibliography is separate: data/bibliography.yaml.


# Shared path filters for GitHub Actions (dorny/paths-filter).
# hugo-build.yml gates deploy on the `site` filter below (single source of truth).
# site    — files that change Hugo output (build, deploy, PR preview, a11y)
# content — job/event/resource markdown and curated YAML lists, plus the
#           lint scripts content-lint.yml runs on them
# forms   — submission form layouts/modules checked by ci-checks.yml
# checks  — inputs of the repository checks (ci-checks.yml)
# A workflow's own file and this file are listed so edits to them are tested.

site:
  - 'content/**'
  - 'data/**'
  - 'layouts/**'
  - 'assets/**'
  - 'static/**'
  - 'archetypes/**'
  - 'hugo.toml'
  - '.github/scripts/build-hugo-site.sh'
  - '.github/workflows/hugo-build.yml'
  - '.github/workflows/preview.yml'
  - '.github/workflows/a11y.yml'
  - '.github/workflows/forum-pulse-cache.yml'
  - '.github/scripts/forum-pulse-cache.mjs'
  - '.github/scripts/lint-data-yaml.mjs'
  - '.github/path-filters.yml'

content:
  - 'content/jobs/**'
  - 'content/events/**'
  - 'content/resources/**'
  - 'data/resources.yaml'
  - 'data/bibliography.yaml'
  - '.github/scripts/lint-content.mjs'
  - '.github/scripts/lint-data-yaml.mjs'
  - '.github/scripts/job-filename-rules.mjs'
  - '.github/scripts/yaml-front-matter.mjs'
  - '.github/scripts/submission-meta.mjs'
  - '.github/scripts/job-url.mjs'
  - '.github/workflows/content-lint.yml'
  - '.github/path-filters.yml'

forms:
  - 'layouts/jobs/job-form.html'
  - 'layouts/events/event-form.html'
  - 'layouts/resources/suggest.html'
  - 'assets/js/job-form.js'
  - 'assets/js/event-form.js'
  - 'assets/js/yaml-front-matter.js'
  - 'workers/job-submit/src/yaml-front-matter.js'
  - '.github/form-modules.sha256'

checks:
  - 'content/jobs/**'
  - 'data/**'
  - 'layouts/jobs/**'
  - 'layouts/events/**'
  - 'layouts/resources/suggest.html'
  - 'assets/js/job-form.js'
  - 'assets/js/event-form.js'
  - 'assets/js/yaml-front-matter.js'
  - 'workers/job-submit/src/yaml-front-matter.js'
  - '.github/scripts/normalize-jobs.mjs'
  - '.github/scripts/extract-form-js.mjs'
  - '.github/scripts/yaml-front-matter.mjs'
  - '.github/scripts/yaml-front-matter.test.mjs'
  - '.github/scripts/sync-worker-yaml-front-matter.mjs'
  - '.github/scripts/job-redirect-aliases.mjs'
  - '.github/scripts/job-filename-rules.mjs'
  - '.github/scripts/link-check-issue.mjs'
  - '.github/scripts/link-check-issue.test.mjs'
  - '.github/scripts/github-api.mjs'
  - '.github/scripts/lint-data-yaml.mjs'
  - '.github/scripts/job-url.mjs'
  - '.github/scripts/job-url.test.mjs'
  - '.github/scripts/wait-for-deploy.mjs'
  - '.github/scripts/wait-for-deploy.test.mjs'
  - '.github/scripts/submission-status.mjs'
  - '.github/scripts/submission-status-render.mjs'
  - '.github/scripts/submission-status-render.test.mjs'
  - '.github/scripts/submission-meta.mjs'
  - '.github/form-modules.sha256'
  - '.github/workflows/ci-checks.yml'
  - '.github/path-filters.yml'

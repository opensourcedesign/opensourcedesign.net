name: Email submitter when submission is not accepted

# When a submission pull request (branch job/*, job-edit/*, event/*,
# event-edit/*, or resource/*, opened by the job-submit Worker) is closed
# without being merged, look up the submitter's private email in KV and send a
# short rejection notice. Skips when the submitter closed their own PR.
# Moderator feedback is taken from the latest issue comment by someone other
# than the PR author. POST /rejection-sent marks the notice as sent (the email
# KV entry is kept so a reopened PR can still get an approval email on merge).

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.sender.login != github.event.pull_request.user.login &&
      (startsWith(github.event.pull_request.head.ref, 'job/') ||
       startsWith(github.event.pull_request.head.ref, 'job-edit/') ||
       startsWith(github.event.pull_request.head.ref, 'event/') ||
       startsWith(github.event.pull_request.head.ref, 'event-edit/') ||
       startsWith(github.event.pull_request.head.ref, 'resource/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Look up submitter email
        id: lookup
        env:
          LOOKUP_URL: ${{ secrets.JOB_LOOKUP_URL }}
          LOOKUP_SECRET: ${{ secrets.JOB_LOOKUP_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$LOOKUP_URL" ] || [ -z "$LOOKUP_SECRET" ]; then
            echo "Lookup secrets not configured; skipping email."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${LOOKUP_URL%/lookup}"
          # Worker or network failures fail the run (so it can be re-run)
          # instead of passing as "not sent" / "no email on file".
          if ! sent_resp="$(curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer ${LOOKUP_SECRET}" "${base}/rejection-sent?pr=${PR_NUMBER}")"; then
            echo "::error::Rejection-status lookup failed - the Worker was unreachable or returned an error."
            exit 1
          fi
          sent="$(printf '%s' "$sent_resp" | jq -r '.sent // false')"
          if [ "$sent" = "true" ]; then
            echo "Rejection email already sent for PR #${PR_NUMBER}; skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! resp="$(curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer ${LOOKUP_SECRET}" "${LOOKUP_URL}?pr=${PR_NUMBER}")"; then
            echo "::error::Email lookup failed - the Worker was unreachable or returned an error."
            exit 1
          fi
          found="$(printf '%s' "$resp" | jq -r '.found // false')"
          if [ "$found" != "true" ]; then
            echo "No email on file for PR #${PR_NUMBER}; nothing to send."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          email="$(printf '%s' "$resp" | jq -r '.email' | tr -d '\r\n')"
          title="$(printf '%s' "$resp" | jq -r '.title // ""' | tr -d '\r\n')"
          title_html="$(printf '%s' "$title" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')"
          case "$HEAD_REF" in
            event-edit/*) kind="event update" ;;
            event/*)      kind="event" ;;
            job-edit/*)   kind="job posting update" ;;
            resource/*)   kind="resource suggestion" ;;
            *)            kind="job posting" ;;
          esac
          case "$HEAD_REF" in
            event-edit/*) subject_kind="event listing update" ;;
            event/*)      subject_kind="event listing" ;;
            job-edit/*)   subject_kind="job posting update" ;;
            resource/*)   subject_kind="resource suggestion" ;;
            *)            subject_kind="job posting" ;;
          esac
          {
            echo "found=true"
            echo "email=${email}"
            echo "title=${title}"
            echo "title_html=${title_html}"
            echo "kind=${kind}"
            echo "subject_kind=${subject_kind}"
          } >> "$GITHUB_OUTPUT"

      - name: Collect moderator feedback
        id: feedback
        if: steps.lookup.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/rejection-feedback.mjs

      - name: Send rejection email
        if: steps.lookup.outputs.found == 'true'
        uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c # v17
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE || 'false' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Open Source Design <${{ secrets.SMTP_FROM }}>
          to: ${{ steps.lookup.outputs.email }}
          subject: Update on your Open Source Design ${{ steps.lookup.outputs.subject_kind || steps.feedback.outputs.submission_label || steps.lookup.outputs.kind }}
          body: |
            Hi,

            Thanks for submitting your ${{ steps.feedback.outputs.submission_label || steps.lookup.outputs.kind }} "${{ steps.lookup.outputs.title }}" to Open Source Design.

            After review, we weren't able to accept it in its current form, so the pull request was closed without merging.

            ${{ steps.feedback.outputs.feedback_plain }}

            Pull request: ${{ steps.feedback.outputs.pr_url }}

            If you'd like to try again, you can update your submission and submit a new one via the ${{ steps.feedback.outputs.form_name || 'submission form' }}:
            ${{ steps.feedback.outputs.form_url }}

            Thanks for supporting open source design!

            - The Open Source Design community
          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8" />
              <style>
                @font-face {
                  font-family: "InterVariable";
                  font-style: normal;
                  font-weight: 100 900;
                  src: url("https://opensourcedesign.net/fonts/InterVariable.woff2") format("woff2");
                }
              </style>
            </head>
            <body style="margin:0;padding:0;background-color:#f1f5f9;">
              <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">An update on your Open Source Design submission.</div>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;">
                <tr><td align="center" style="padding:32px 16px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;">
                    <tr>
                      <td style="background-color:#0f172a;border-radius:12px 12px 0 0;padding:20px 32px;">
                        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
                          <td><img src="https://opensourcedesign.net/images/email/osd-logo-white.png" width="32" height="32" alt="Open Source Design logo" style="display:block;border:0;" /></td>
                          <td style="padding-left:12px;font-family:'InterVariable',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#ffffff;">Open Source Design</td>
                        </tr></table>
                      </td>
                    </tr>
                    <tr>
                      <td style="background-color:#ffffff;padding:36px 32px;font-family:'InterVariable',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                        <h1 style="margin:0 0 20px;font-size:22px;line-height:1.3;color:#0f172a;">Update on your submission</h1>
                        <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#334155;">Hi,</p>
                        <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#334155;">Thanks for submitting your ${{ steps.feedback.outputs.submission_label || steps.lookup.outputs.kind }} <strong style="color:#0f172a;">&ldquo;${{ steps.lookup.outputs.title_html }}&rdquo;</strong> to Open Source Design.</p>
                        <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#334155;">After review, we weren&rsquo;t able to accept it in its current form, so the pull request was closed without merging.</p>
                        ${{ steps.feedback.outputs.feedback_html_block }}
                        <p style="margin:0 0 12px;font-size:13px;line-height:1.6;color:#64748b;">Pull request:<br /><a href="${{ steps.feedback.outputs.pr_url }}" style="color:#0f766e;word-break:break-all;">${{ steps.feedback.outputs.pr_url }}</a></p>
                        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px 0;"><tr>
                          <td style="border-radius:8px;background-color:#0f172a;">
                            <a href="${{ steps.feedback.outputs.form_url }}" style="display:inline-block;padding:13px 28px;font-family:'InterVariable',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">Submit again via the ${{ steps.feedback.outputs.form_name || 'form' }} &rarr;</a>
                          </td>
                        </tr></table>
                        <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b;">Or copy this link:<br /><a href="${{ steps.feedback.outputs.form_url }}" style="color:#0f766e;word-break:break-all;">${{ steps.feedback.outputs.form_url }}</a></p>
                        <p style="margin:24px 0 0;font-size:15px;line-height:1.6;color:#334155;">Thanks for supporting open source design!</p>
                      </td>
                    </tr>
                    <tr>
                      <td style="background-color:#f8fafc;border-radius:0 0 12px 12px;border-top:1px solid #e2e8f0;padding:20px 32px;font-family:'InterVariable',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.7;color:#64748b;">
                        <strong style="color:#475569;">Open Source Design</strong> - a community of designers and developers improving the usability of open source software.<br />
                        <a href="https://opensourcedesign.net" style="color:#64748b;">opensourcedesign.net</a> &nbsp;&middot;&nbsp; <a href="https://discourse.opensourcedesign.net" style="color:#64748b;">Forum</a> &nbsp;&middot;&nbsp; <a href="https://opensourcedesign.net/jobs/" style="color:#64748b;">Job board</a>
                      </td>
                    </tr>
                  </table>
                </td></tr>
              </table>
            </body>
            </html>

      - name: Mark rejection email sent
        if: steps.lookup.outputs.found == 'true'
        env:
          LOOKUP_URL: ${{ secrets.JOB_LOOKUP_URL }}
          LOOKUP_SECRET: ${{ secrets.JOB_LOOKUP_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$LOOKUP_URL" ] || [ -z "$LOOKUP_SECRET" ]; then exit 0; fi
          base="${LOOKUP_URL%/lookup}"
          curl -fsS --retry 3 --retry-all-errors -X POST -H "Authorization: Bearer ${LOOKUP_SECRET}" "${base}/rejection-sent?pr=${PR_NUMBER}" \
            || echo "::warning::Could not mark the rejection email as sent; re-running this workflow would email again."

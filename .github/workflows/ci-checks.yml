# Repository hygiene checks (filenames, form modules, redirect aliases).
name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2

      - name: Detect repository-check inputs
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: .github/path-filters.yml

  checks:
    needs: changes
    if: needs.changes.outputs.checks == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Job filename and status conventions
        run: node .github/scripts/normalize-jobs.mjs --check

      - name: Form modules in sync with layouts
        run: node .github/scripts/extract-form-js.mjs --check

      - name: Job Markdown sanitization
        run: node --test .github/scripts/job-form.test.mjs

      - name: YAML front matter parser
        run: node --test .github/scripts/yaml-front-matter.test.mjs

      - name: Link check issue parser
        run: node --test .github/scripts/link-check-issue.test.mjs

      - name: Worker YAML parser in sync
        run: node .github/scripts/sync-worker-yaml-front-matter.mjs --check

      - name: Job redirect aliases
        run: node .github/scripts/job-redirect-aliases.mjs --check

      - name: Data YAML schema
        run: |
          npm install --no-save yaml@2
          node .github/scripts/lint-data-yaml.mjs

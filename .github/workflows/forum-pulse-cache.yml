# Cache Discourse latest topics for Hugo builds (no build-time network call).
# The homepage still refreshes via the Worker /forum proxy in the browser.
#
# main is branch-protected (PRs required), so this workflow does not push there.
# When the topics change it dispatches hugo-build, which refreshes the cache
# before deploy. "Changed" means different from the last topics this workflow
# saw: the committed data/forum-pulse.json is only a placeholder, so each run
# records a hash of the topic list in the Actions cache and compares with that.
name: Refresh forum pulse cache

on:
  schedule:
    - cron: "17 */12 * * *" # every 12 hours at :17
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: forum-pulse-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Fetch latest forum topics
        id: fetch
        env:
          FORUM_URL: https://discourse.opensourcedesign.net
        run: node .github/scripts/forum-pulse-cache.mjs

      - name: Check whether these topics were seen before
        id: seen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/forum-pulse.json
          key: forum-pulse-${{ steps.fetch.outputs.topics_hash }}
          lookup-only: true

      - name: Trigger site rebuild
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo-build.yml --ref main

      - name: Remember these topics
        if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/forum-pulse.json
          key: forum-pulse-${{ steps.fetch.outputs.topics_hash }}

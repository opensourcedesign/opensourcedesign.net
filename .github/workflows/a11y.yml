# WCAG 2 AA checks on a curated set of representative pages (not the full sitemap).
name: Accessibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.166.0
  TAILWIND_VERSION: 4.3.3

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Detect site-affecting changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  a11y:
    needs: changes
    if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('assets/**', 'hugo.toml', 'layouts/partials/resolve-image.html', 'layouts/_default/_markup/render-image.html') }}
          restore-keys: |
            hugo-resources-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save "tailwindcss@${TAILWIND_VERSION}" "@tailwindcss/cli@${TAILWIND_VERSION}"
          npx @tailwindcss/cli -i assets/css/main.css -o assets/css/compiled.css --minify

      - name: Build site
        run: hugo --minify --gc

      - name: Generate pa11y URL list
        run: node .github/scripts/generate-pa11yci-config.mjs

      - name: Install pa11y
        run: npm install --no-save pa11y@6 serve@14

      - name: Run accessibility checks
        run: |
          npx serve public -l 4321 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4321/" >/dev/null; then
              break
            fi
            sleep 1
          done
          node .github/scripts/run-pa11y-batch.mjs

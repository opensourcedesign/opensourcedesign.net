name: Build and Deploy Hugo

# Production deploy runs only when site output can change. Path list lives in
# `.github/path-filters.yml` (`site` filter). Use workflow_dispatch to force a rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0
  # Keep in lockstep with the @tailwindcss/browser version pinned in
  # layouts/_default/baseof.html (the local-dev Play CDN fallback).
  TAILWIND_VERSION: 4.3.3
  # Pagefind is a standalone Rust binary downloaded straight from GitHub
  # releases - no npm involved. Update the version and checksum together
  # (checksum from the .tar.gz.sha256 asset on the release page).
  PAGEFIND_VERSION: 1.5.2
  PAGEFIND_SHA256: afb824a9e7f64905a934900481cea5be679c03975e527329e0e5e6cc70f5feda

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2

      - name: Detect site-affecting changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: .github/path-filters.yml

  build-and-deploy:
    needs: changes
    # `changes` is skipped on workflow_dispatch, and a job whose needs were
    # skipped is itself skipped unless its condition calls a status function -
    # so the dispatch branch needs !cancelled()/!failure() to ever run.
    if: >-
      ${{ !cancelled() && !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      # The trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Cache Hugo's processed asset derivatives (resized images, AVIF/WebP
      # encodes). This skips expensive re-encoding when the source images and
      # image templates are unchanged, keeping builds fast. The prod- prefix is
      # only ever saved by this workflow on main; previews restore it
      # read-only, so a PR can't plant files that end up deployed. Restore and
      # save are separate steps so the cache is saved even when a later step
      # fails (actions/cache only saves after a fully successful job).
      - name: Restore Hugo resources cache
        id: resources-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/_gen
          key: hugo-resources-prod-${{ hashFiles('assets/**', 'hugo.toml', 'layouts/partials/resolve-image.html', 'layouts/_default/_markup/render-image.html') }}
          restore-keys: |
            hugo-resources-prod-

      # Compile Tailwind to a small static stylesheet for production. Local
      # contributors still need no build step (issue #556): when this file is
      # absent, baseof.html falls back to the Tailwind Play CDN. The CLI scans
      # layouts/, assets/ and content/ for utility classes automatically.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Fail in seconds on a broken data file (like the resources.yaml indent
      # error of #633) instead of after minutes of cold Hugo image processing.
      - name: Validate data YAML
        run: |
          npm install --no-save yaml@2
          node .github/scripts/lint-data-yaml.mjs

      - name: Compile Tailwind CSS
        run: |
          npm install --no-save "tailwindcss@${TAILWIND_VERSION}" "@tailwindcss/cli@${TAILWIND_VERSION}"
          npx @tailwindcss/cli -i assets/css/main.css -o assets/css/compiled.css --minify

      # The Pagefind search indexer is fetched as a prebuilt binary.
      - name: Install Pagefind
        run: |
          curl -fsSL -o pagefind.tar.gz \
            "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${PAGEFIND_SHA256}  pagefind.tar.gz" | sha256sum --check
          tar -xzf pagefind.tar.gz
          rm pagefind.tar.gz
          chmod +x pagefind

      # Best effort: if Discourse is down, build with the committed
      # data/forum-pulse.json (the homepage also refreshes it client-side)
      # rather than blocking the deploy.
      - name: Refresh forum pulse cache
        continue-on-error: true
        env:
          FORUM_URL: https://discourse.opensourcedesign.net
        run: node .github/scripts/forum-pulse-cache.mjs

      - name: Build site
        run: bash .github/scripts/build-hugo-site.sh production

      - name: Save Hugo resources cache
        if: always() && steps.resources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/_gen
          key: ${{ steps.resources-cache.outputs.cache-primary-key }}

      # Mirror public/ to gh-pages root but keep pr-preview/ so production
      # deploys do not wipe open PR previews (see preview.yml).
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          workdir="gh-pages-deploy"
          preview_backup=""
          rm -rf "$workdir"
          if git clone --depth=1 --branch=gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            "$workdir" 2>/dev/null; then
            :
          else
            mkdir "$workdir"
            git -C "$workdir" init
            git -C "$workdir" checkout --orphan gh-pages
            git -C "$workdir" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          if [ -d "$workdir/pr-preview" ]; then
            preview_backup=$(mktemp -d)
            cp -a "$workdir/pr-preview" "$preview_backup/"
          fi
          find "$workdir" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a public/. "$workdir/"
          if [ -n "$preview_backup" ] && [ -d "$preview_backup/pr-preview" ]; then
            cp -a "$preview_backup/pr-preview" "$workdir/"
          fi
          git -C "$workdir" add -A
          if git -C "$workdir" diff --staged --quiet; then
            echo "No gh-pages changes to deploy"
            exit 0
          fi
          git -C "$workdir" commit -m "deploy: Hugo site from ${GITHUB_SHA}"
          git -C "$workdir" push origin HEAD:gh-pages
